name: Build iOS App (Unsigned IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Build the app with swiftc (Release, iOS device, unsigned)
        run: |
          chmod +x build-ipa.sh
          ./build-ipa.sh > "$RUNNER_TEMP/build.log" 2>&1

      - name: Show build log on failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/build.log" || true

      - name: Upload build log (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 30

      - name: Verify IPA exists
        run: |
          if [ ! -f "TapTheCircle.ipa" ]; then
            echo "error: TapTheCircle.ipa not found" >&2
            exit 1
          fi
          echo "IPA found: TapTheCircle.ipa"

      - name: Verify IPA is a valid ZIP archive
        run: |
          if ! unzip -t TapTheCircle.ipa > /dev/null 2>&1; then
            echo "error: IPA is not a valid ZIP archive" >&2
            exit 1
          fi
          echo "IPA is a valid ZIP archive"

      - name: Verify Payload/TapTheCircle.app inside IPA
        run: |
          if ! unzip -l TapTheCircle.ipa | grep -q 'Payload/TapTheCircle.app/'; then
            echo "error: Payload/TapTheCircle.app not found inside IPA" >&2
            exit 1
          fi
          echo "Payload/TapTheCircle.app confirmed inside IPA"

      - name: Verify Info.plist inside .app inside IPA
        run: |
          if ! unzip -l TapTheCircle.ipa | grep -q 'Payload/TapTheCircle.app/Info.plist'; then
            echo "error: Info.plist not found inside .app bundle in IPA" >&2
            exit 1
          fi
          echo "Info.plist found inside .app bundle"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapTheCircle-ipa
          path: TapTheCircle.ipa
          retention-days: 30
