name: Build iOS App (Unsigned IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build the app (Release, generic iOS device, unsigned)
        run: |
          xcodebuild \
            -project TapTheCircle.xcodeproj \
            -scheme TapTheCircle \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate the built .app
        id: locate_app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "TapTheCircle.app" -maxdepth 6 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "error: TapTheCircle.app not found" >&2
            exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Package the .app into an unsigned IPA
        run: |
          APP_PATH="${{ steps.locate_app.outputs.app_path }}"
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          # iTunesArtwork is optional; omit for an unsigned build.
          IPA_PATH="$RUNNER_TEMP/TapTheCircle.ipa"
          rm -f "$IPA_PATH"
          (cd "$RUNNER_TEMP" && zip -r -X "TapTheCircle.ipa" Payload)

          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapTheCircle-ipa
          path: ${{ steps.locate_app.outputs.ipa_path || steps.package.outputs.ipa_path }}
          retention-days: 30
