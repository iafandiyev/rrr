name: Build iOS App (Unsigned IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select a compatible Xcode
        run: |
          echo "=== Available Xcode installations ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "No Xcode.app bundles found in /Applications"
          echo ""
          echo "=== xcode-select path ==="
          xcode-select -p 2>/dev/null || echo "xcode-select not set"
          echo ""
          echo "=== xcodebuild versions ==="
          for xc in /Applications/Xcode*.app; do
            if [ -d "$xc" ]; then
              echo "--- $xc ---"
              "$xc/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null || echo "  (could not read version)"
            fi
          done
          echo ""
          # Prefer an Xcode 15 installation; fall back to the system-selected Xcode.
          SELECTED_XCODE=""
          for xc in /Applications/Xcode_15*.app /Applications/Xcode*.app; do
            if [ -d "$xc" ] && [ -x "$xc/Contents/Developer/usr/bin/xcodebuild" ]; then
              SELECTED_XCODE="$xc"
              break
            fi
          done
          if [ -z "$SELECTED_XCODE" ]; then
            echo "error: No compatible Xcode installation found" >&2
            exit 1
          fi
          echo "Selected Xcode: $SELECTED_XCODE"
          sudo xcode-select -switch "$SELECTED_XCODE/Contents/Developer"
          echo ""
          echo "=== Active xcodebuild version ==="
          xcodebuild -version

      - name: Diagnose project and schemes
        run: |
          echo "=== xcodebuild -list ==="
          xcodebuild -list -project TapTheCircle.xcodeproj 2>&1 || true
          echo ""
          echo "=== Project files ==="
          ls -la TapTheCircle.xcodeproj/
          echo ""
          echo "=== Scheme file ==="
          cat TapTheCircle.xcodeproj/xcshareddata/xcschemes/TapTheCircle.xcscheme

      - name: Build the app (Release, generic iOS device, unsigned)
        run: |
          set -x
          xcodebuild archive \
            -project TapTheCircle.xcodeproj \
            -scheme TapTheCircle \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/TapTheCircle.xcarchive" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify the built .app exists
        run: |
          APP_PATH="$RUNNER_TEMP/TapTheCircle.xcarchive/Products/Applications/TapTheCircle.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "error: TapTheCircle.app not found at $APP_PATH" >&2
            exit 1
          fi
          echo "Found .app at $APP_PATH"

      - name: Verify Info.plist inside .app
        run: |
          APP_PATH="$RUNNER_TEMP/TapTheCircle.xcarchive/Products/Applications/TapTheCircle.app"
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "error: Info.plist not found inside .app bundle" >&2
            exit 1
          fi
          echo "Info.plist found inside .app bundle"

      - name: Package the .app into an unsigned IPA
        id: package
        run: |
          APP_PATH="$RUNNER_TEMP/TapTheCircle.xcarchive/Products/Applications/TapTheCircle.app"
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          IPA_PATH="$RUNNER_TEMP/TapTheCircle.ipa"
          rm -f "$IPA_PATH"
          (cd "$RUNNER_TEMP" && zip -r -X "TapTheCircle.ipa" Payload)

          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT
          ls -lh "$IPA_PATH"

      - name: Verify IPA is a valid ZIP archive
        run: |
          IPA_PATH="${{ steps.package.outputs.ipa_path }}"
          if ! unzip -t "$IPA_PATH" > /dev/null 2>&1; then
            echo "error: IPA is not a valid ZIP archive" >&2
            exit 1
          fi
          echo "IPA is a valid ZIP archive"

      - name: Verify Payload/TapTheCircle.app inside IPA
        run: |
          IPA_PATH="${{ steps.package.outputs.ipa_path }}"
          if ! unzip -l "$IPA_PATH" | grep -q 'Payload/TapTheCircle.app/'; then
            echo "error: Payload/TapTheCircle.app not found inside IPA" >&2
            exit 1
          fi
          echo "Payload/TapTheCircle.app confirmed inside IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapTheCircle-ipa
          path: ${{ steps.package.outputs.ipa_path }}
          retention-days: 30
